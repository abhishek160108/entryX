<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="8" />

  <!-- Outer scanning frame corners -->
  <path d="M 96 156 L 96 116 A 20 20 0 0 1 116 96 L 156 96" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 356 96 L 396 96 A 20 20 0 0 1 416 116 L 416 156" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 416 356 L 416 396 A 20 20 0 0 1 396 416 L 356 416" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 156 416 L 116 416 A 20 20 0 0 1 96 396 L 96 356" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />

  <!-- Cinema Ticket Silhouette with notches -->
  <path d="M 150 140 
           H 362 
           A 22 22 0 0 1 384 162 
           V 220 
           A 36 36 0 0 0 384 292 
           V 350 
           A 22 22 0 0 1 362 372 
           H 150 
           A 22 22 0 0 1 128 350 
           V 292 
           A 36 36 0 0 0 128 220 
           V 162 
           A 22 22 0 0 1 150 140 Z" 
        fill="#131D31" 
        stroke="#334155" 
        stroke-width="7" />

  <!-- Ticket Perforation Line -->
  <line x1="210" y1="144" x2="210" y2="368" stroke="#334155" stroke-dasharray="8 8" stroke-width="4" />

  <!-- QR Matrix subtle pattern on left stub -->
  <rect x="154" y="174" width="16" height="16" rx="3" fill="#38BDF8" opacity="0.8" />
  <rect x="178" y="174" width="16" height="16" rx="3" fill="#38BDF8" opacity="0.5" />
  <rect x="154" y="198" width="16" height="16" rx="3" fill="#38BDF8" opacity="0.5" />
  <rect x="178" y="222" width="16" height="16" rx="3" fill="#38BDF8" opacity="0.8" />
  <rect x="154" y="278" width="16" height="16" rx="3" fill="#38BDF8" opacity="0.6" />
  <rect x="178" y="302" width="16" height="16" rx="3" fill="#38BDF8" opacity="0.8" />

  <!-- Glowing Checkmark / Dynamic "X" Element on Right Ticket Body -->
  <!-- Checkmark arm going down -->
  <path d="M 245 256 L 290 305 L 375 190" 
        fill="none" 
        stroke="url(#neonGreen)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Intersecting stylish cross arm completing the subtle 'X' identity -->
  <path d="M 375 305 L 325 250" 
        fill="none" 
        stroke="url(#neonGreen)" 
        stroke-width="22" 
        stroke-linecap="round" 
        opacity="0.9"
        filter="url(#glow)" />

  <!-- Scanline Laser Beam Effect -->
  <line x1="120" y1="256" x2="392" y2="256" stroke="#00FFA3" stroke-width="3" opacity="0.6" stroke-dasharray="12 6" />
</svg>
